

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View photographs of mountain landscapes and nature for your Lesotho trip.">
    <title>Gallery  Lesotho Tourism</title>
    <link href="https:cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark tourism-nav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Lesotho Tourism</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacts.html">Contacts</a></li>
                </ul>
                <button id="themeToggle" class="btn btn-outline-light ms-lg-3 mt-2 mt-lg-0">Dark mode</button>
            </div>
        </div>
    </nav>
</header>

<main class="container py-5">
    <section class="page-heading text-center mb-5">
        <h1>Photo Gallery</h1>
        <p class="lead">Explore the beauty of mountains, nature and outdoor adventures.</p>
    </section>

    <section aria-label="Tourism photographs">
        <div class="row g-4" id="galleryGrid">
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="0"
                    aria-label="Preview mountain landscape">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
                        class="gallery-img" alt="Tall mountains and a scenic landscape">
                    <span>Mountain Landscapes</span>
                </button>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="1"
                    aria-label="Preview waterfall">
                    <img src="waterfall.jpg"
                        class="gallery-img" alt="Waterfall surrounded by rocks and greenery">
                    <span>Waterfalls</span>
                </button>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="2"
                    aria-label="Preview hiking trail">
                    <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=900&q=80"
                        class="gallery-img" alt="Hikers exploring a mountain trail">
                    <span>Hiking Adventures</span>
                </button>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="3"
                    aria-label="Preview forest trail">
                    <img src="nature.webp"
                        class="gallery-img" alt="Walking path through a natural forest">
                    <span>Nature</span>
                </button>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="4"
                    aria-label="Preview natural landscape">
                    <img src="landscape.webp"
                        class="gallery-img" alt="Wide African landscape">
                    <span>Open Landscapes</span>
                </button>
            </div>
            <div class="col-12 col-sm-6 col-lg-4">
                <button type="button" class="gallery-button" data-gallery-image="5"
                    aria-label="Preview accommodation">
                    <img src="accomodation.webp"
                        class="gallery-img" alt="Hotel and holiday accommodation">
                    <span>Accommodation</span>
                </button>
            </div>
        </div>
    </section>

    
    <div class="modal fade" id="imageModal" tabindex="-1"
        aria-labelledby="imageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="imageModalLabel">Photo Preview</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close image preview"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" alt="" class="img-fluid rounded">
                    <p id="modalCaption" class="mt-3"></p>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-success" id="previousImage">Previous</button>
                    <span id="imageCounter" aria-live="polite"></span>
                    <button type="button" class="btn btn-success" id="nextImage">Next</button>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer text-center">
